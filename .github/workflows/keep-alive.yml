name: Keep Supabase alive

# Pings a rota /health do backend (que agora faz uma query real à base de
# dados) de 3 em 3 dias, para que o projecto Supabase nunca complete os 7
# dias sem actividade que despoletam a pausa automática do plano free.
on:
  schedule:
    - cron: '0 6 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pingar /health do backend
        run: |
          if [ -z "${{ vars.BACKEND_HEALTH_URL }}" ]; then
            echo "Falta configurar a variável do repositório BACKEND_HEALTH_URL (Settings > Secrets and variables > Actions > Variables), ex: https://sige-backend.onrender.com/health"
            exit 1
          fi
          curl -fsS "${{ vars.BACKEND_HEALTH_URL }}"
